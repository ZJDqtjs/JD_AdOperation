services:
  jd-roi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络务必换镜像源，否则 pip 会超时；见 .env.example
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: jd-roi:latest
    container_name: jd-roi
    restart: unless-stopped
    # Chromium 是多进程浏览器：浏览器进程退出时，它的子进程（zygote / GPU / 渲染器 /
    # 崩溃处理器）会被 reparent 给最近的上层进程。容器里没有 init 时那个"上层"就是
    # PID 1（= entrypoint 里 exec 出来的 uvicorn），而 Python 不会 wait() 任意子进程，
    # 孤儿退出后就永久停在 <defunct>，越积越多（实测堆到 834 个，PPID 全是 uvicorn）。
    # init: true 让 Docker 注入 tini 作为 PID 1，专门负责回收这些孤儿。
    init: true
    ports:
      - "${JD_WEB_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JD_SCHEDULE_HOUR: "${JD_SCHEDULE_HOUR:-1}"
      JD_SCHEDULE_MINUTE: "${JD_SCHEDULE_MINUTE:-0}"
      # 基准时间上的随机浮动（分钟），避免每天同一秒被抓取风控识别
      JD_SCHEDULE_JITTER: "${JD_SCHEDULE_JITTER:-30}"
      JD_REFRESH_DAYS: "${JD_REFRESH_DAYS:-15}"
      JD_MAX_BACKFILL_DAYS: "${JD_MAX_BACKFILL_DAYS:-120}"
      JD_RUN_ON_START: "${JD_RUN_ON_START:-1}"
      JD_ENABLE_SCHEDULER: "${JD_ENABLE_SCHEDULER:-1}"
      JD_SCOPE: "${JD_SCOPE:-}"
      # 供货方 SKU 成本接口（算「每个 SKU 自己的保本线」）。token 只写 .env，别提交
      JD_COSTS_URL: "${JD_COSTS_URL:-}"
      JD_COSTS_TOKEN: "${JD_COSTS_TOKEN:-}"
      JD_COSTS_TTL: "${JD_COSTS_TTL:-21600}"
      JD_COSTS_TIMEOUT: "${JD_COSTS_TIMEOUT:-20}"
      # ---- 登录态保活：后台进程定时「用一下」京准通，防止 sdtoken 30 分钟过期被踢 ----
      JD_KEEPALIVE: "${JD_KEEPALIVE:-1}"
      JD_KEEPALIVE_INTERVAL: "${JD_KEEPALIVE_INTERVAL:-1200}"
      JD_KEEPALIVE_JITTER: "${JD_KEEPALIVE_JITTER:-120}"
      JD_KEEPALIVE_PAGES: "${JD_KEEPALIVE_PAGES:-}"
      JD_KEEPALIVE_DWELL: "${JD_KEEPALIVE_DWELL:-8000}"
      JD_KEEPALIVE_EXPORT_STATE: "${JD_KEEPALIVE_EXPORT_STATE:-0}"
      # ---- 分时数据（京准通列表行「趋势」）：只在夜间抓昨天，避免被风控 ----
      JD_HOURLY: "${JD_HOURLY:-1}"
      JD_HOURLY_PLANS: "${JD_HOURLY_PLANS:-20}"
      JD_HOURLY_SLEEP: "${JD_HOURLY_SLEEP:-0.4}"
      JD_HOURLY_DAYS: "${JD_HOURLY_DAYS:-1}"
      # ---- AI 解读层（jd_roi.analyze_ai / jd_roi.llm）----
      # OpenAI 兼容端点；Key 只写 .env，别提交。容器内不挂 .env，只能靠这里注入
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-8000}"
      JD_AI_ENABLED: "${JD_AI_ENABLED:-1}"
      JD_AI_RANGE_DAYS: "${JD_AI_RANGE_DAYS:-7}"
      # 也可以在环境变量里直接给账号（JSON），优先级高于 config/accounts.json
      # JD_ACCOUNTS: '[{"key":"main","label":"主账号","account_id":10000000001}]'
    volumes:
      - ./docker-data:/data      # 按天数据 + 状态
      - ./docker-auth:/auth      # 浏览器 Profile / 登录态
      - ./docker-config:/config  # accounts.json / costs.json / 成本表 xlsx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 40s
